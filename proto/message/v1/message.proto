syntax = "proto3";

package messager.v1;

service Messager {
  rpc Send(SendRequest) returns (SendReply) {};
}

message SendRequest {
  oneof destination {
    string to        = 1; // Phone number
    string recipient = 2;  // Meta user ID (BSUID)
  }

  oneof content {
    TextContent        text        = 3;
    ImageContent       image       = 4;
    InteractiveContent interactive = 5;
  }
}

message TextContent {
  bool   preview_url = 1;
  string body        = 2;
}

message ImageContent {
  string link = 1;
}

message InteractiveContent {
  InteractiveHeader header = 1;
  InteractiveBody   body   = 2;
  InteractiveFooter footer = 3;

  oneof type {
    ListAction               list                 = 10;
    ButtonAction             button               = 11;
    RequestContactInfoAction request_contact_info = 12;
  }
}

message InteractiveHeader {
  string text = 1;
}

message InteractiveBody {
  string text = 1;
}

message InteractiveFooter {
  string text = 1;
}

message ListAction {
  string               button   = 1;
  repeated ListSection sections = 2;
}

message ListSection {
  string           title = 1;
  repeated ListRow rows  = 2;
}

message ListRow {
  string id          = 1;
  string title       = 2;
  string description = 3;
}

message ButtonAction {
  repeated ReplyButton buttons = 1;
}

message ReplyButton {
  string id    = 1;
  string title = 2;
}

message RequestContactInfoAction {
  string name = 1;
}

message SendReply {
  string message_id = 1;
}